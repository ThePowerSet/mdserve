<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdserve</title>

<link rel="stylesheet" href="/vendor/katex.min.css">
<link rel="stylesheet" href="/vendor/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/github-dark.min.css" media="(prefers-color-scheme: dark)">

<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d8dee4;
    --surface: #f6f8fa;
    --accent: #0969da;
    --live: #1a7f37;
    --dead: #cf222e;
    --sidebar: 288px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8d96a0;
      --border: #30363d;
      --surface: #161b22;
      --accent: #4493f8;
      --live: #3fb950;
      --dead: #f85149;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* ---------------------------------------------------------- layout */

  #shell { display: flex; align-items: flex-start; }

  aside {
    position: sticky;
    top: 0;
    flex: none;
    display: flex;
    flex-direction: column;
    width: var(--sidebar);
    height: 100vh;
    padding: 10px 10px 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  aside h2 {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 6px 6px 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  aside h2 .count { letter-spacing: 0; opacity: .7; }

  /* Either pane folds away, and the whole sidebar with them. */
  .fold { cursor: pointer; user-select: none; align-items: center; }
  .fold:hover { color: var(--fg); }
  .fold .caret {
    display: inline-block;
    width: 9px;
    font-size: 9px;
    transition: transform .12s ease;
  }
  #sessionToggle .current {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    opacity: .8;
  }
  #sessionPane:not(.collapsed) #sessionToggle .current { display: none; }
  .collapsed > .fold .caret { transform: rotate(-90deg); }
  #sessionPane.collapsed #sessionBody,
  #turnPane.collapsed #turnBody { display: none; }
  /* Folded, the questions pane must stop claiming the leftover height. */
  #turnPane.collapsed { flex: none; }

  /* Hiding the sidebar outright, leaving the conversation the whole window. */
  #shell.no-sidebar aside { display: none; }
  #sidebarToggle { flex: none; padding: 3px 7px; font-size: 13px; line-height: 1.2; }
  #sessionPane { flex: none; max-height: 38vh; overflow-y: auto; }
  #turnPane {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  #turnBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #turns { overflow-y: auto; padding-bottom: 12px; }

  .session, .jump {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .session:hover, .jump:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }

  /* A session row is a button plus its delete affordance, so the delete
     button is a sibling: a button inside a button is not valid HTML. */
  .row { position: relative; }
  .row .session { padding-right: 34px; }
  .row .del {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 6px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    line-height: 1.4;
    cursor: pointer;
    opacity: 0;
  }
  .row:hover .del, .row .del:focus-visible { opacity: 1; }
  .row .del:hover { color: var(--dead); background: color-mix(in srgb, var(--dead) 12%, transparent); }
  /* Armed: one more click and it is gone, so it stops hiding itself. */
  .row .del.confirm {
    opacity: 1;
    color: var(--dead);
    border-color: var(--dead);
    font-size: 10.5px;
  }
  .session.active {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .session .name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.35;
  }
  .session .sub {
    margin-top: 3px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session .sub .dot { opacity: .5; margin: 0 4px; }
  #latest .name { font-weight: 600; }
  #empty, #noTurns { padding: 8px 10px; font-size: 12px; color: var(--muted); }

  /* The question index: one row per prompt, the reader's spine through the
     conversation. */
  .jump {
    display: flex;
    gap: 8px;
    padding: 6px 8px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--muted);
  }
  .jump .n {
    flex: none;
    min-width: 1.4em;
    font-variant-numeric: tabular-nums;
    text-align: right;
    opacity: .6;
  }
  .jump .q {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .jump.here {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--fg);
  }
  .jump.here .n { opacity: 1; color: var(--accent); }

  #pane { flex: 1; min-width: 0; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dead);
    flex: none;
    transition: background .2s;
  }
  #dot.live { background: var(--live); }
  #where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .spacer { flex: 1; }
  header label { display: flex; gap: 5px; align-items: center; cursor: pointer; user-select: none; white-space: nowrap; }
  header button {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: inherit;
    font: inherit;
    line-height: 1.4;
    cursor: pointer;
  }
  header button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  header button:disabled { opacity: .4; cursor: default; }
  #pos { font-variant-numeric: tabular-nums; white-space: nowrap; }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px 60vh;
    overflow-wrap: break-word;
  }

  @media (max-width: 900px) {
    #shell { display: block; }
    aside {
      position: static;
      width: auto;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    #sessionPane { max-height: 24vh; }
    #turnPane { max-height: 26vh; }
  }

  /* ----------------------------------------------------------- turns */

  .turn { scroll-margin-top: 52px; }
  .turn + .turn { margin-top: 26px; }

  /* A prompt reads as an interruption in the flow, not as another heading. */
  .ask {
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    background: var(--surface);
  }
  .ask + .reply { margin-top: 20px; }
  .ask .who {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .ask .who .idx { color: var(--accent); font-weight: 600; }
  .ask .who .when { text-transform: none; letter-spacing: 0; opacity: .8; }
  .ask .body > :first-child { margin-top: 0; }
  .ask .body > :last-child { margin-bottom: 0; }

  /* A pasted wall of text should not bury the answer under it. */
  .ask.clipped .body {
    max-height: 190px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 130px, transparent);
    mask-image: linear-gradient(#000 130px, transparent);
  }
  .more {
    display: none;
    margin-top: 6px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .ask.clipped .more, .ask.was-clipped .more { display: inline-block; }
  .more:hover { border-color: var(--accent); color: var(--accent); }

  /* --------------------------------------------------------- content */

  h1, h2, h3, h4 { line-height: 1.3; margin: 1.6em 0 .6em; font-weight: 600; }
  main h1 { font-size: 1.9em; }
  main h2 { font-size: 1.45em; padding-bottom: .25em; border-bottom: 1px solid var(--border); }
  main h3 { font-size: 1.2em; }
  .turn > :first-child, .reply > :first-child { margin-top: 0; }
  p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
  .turn > :last-child { margin-bottom: 0; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  blockquote {
    margin-left: 0;
    padding: .1em 1em;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  li { margin: .25em 0; }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .88em;
  }
  :not(pre) > code {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: .1em .35em;
  }
  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .ask pre { background: var(--bg); }
  pre code { background: none; padding: 0; border: 0; }

  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; }
  th { background: var(--surface); }

  img { max-width: 100%; }

  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .math-error {
    color: var(--dead);
    font-family: ui-monospace, monospace;
    font-size: .85em;
  }

  #banner {
    display: none;
    margin: 0 0 1.5em;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--dead);
    border-radius: 6px;
    background: var(--surface);
    font-size: 14px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div id="shell">
  <aside>
    <div id="sessionPane">
      <h2 id="sessionToggle" class="fold" role="button" tabindex="0" aria-expanded="true" aria-controls="sessionBody">
        <span class="caret">&#9662;</span>
        <span>Sessions</span>
        <span class="count" id="sessionCount"></span>
        <span class="current" id="currentSession"></span>
      </h2>
      <div id="sessionBody">
        <button class="session active" id="latest">
          <span class="name">Latest</span>
          <span class="sub">whichever answered last</span>
        </button>
        <div id="list"></div>
        <div id="empty">No sessions yet. Finish a turn in Claude Code.</div>
      </div>
    </div>

    <div id="turnPane">
      <h2 id="turnToggle" class="fold" role="button" tabindex="0" aria-expanded="true" aria-controls="turnBody">
        <span class="caret">&#9662;</span>
        <span>Questions</span>
        <span class="count" id="turnCount"></span>
      </h2>
      <div id="turnBody">
        <div id="turns"></div>
        <div id="noTurns">This session has no prompts yet.</div>
      </div>
    </div>
  </aside>

  <div id="pane">
    <header>
      <button id="sidebarToggle" title="show or hide the sidebar (s)" aria-label="toggle sidebar">&#9776;</button>
      <span id="dot" title="connection"></span>
      <span id="where">—</span>
      <span class="spacer"></span>
      <button id="prev" title="previous question (k)">↑</button>
      <span id="pos">—</span>
      <button id="next" title="next question (j)">↓</button>
      <button id="end" title="jump to the latest turn (G)">latest</button>
      <label><input type="checkbox" id="follow" checked> follow</label>
    </header>
    <main>
      <div id="banner"></div>
      <div id="doc"></div>
    </main>
  </div>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/katex.min.js"></script>
<script src="/vendor/highlight.min.js"></script>

<script>
const doc = document.getElementById('doc');
const dot = document.getElementById('dot');
const where = document.getElementById('where');
const follow = document.getElementById('follow');
const banner = document.getElementById('banner');
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const latestBtn = document.getElementById('latest');
const shell = document.getElementById('shell');
const sessionPane = document.getElementById('sessionPane');
const sessionToggle = document.getElementById('sessionToggle');
const turnPane = document.getElementById('turnPane');
const turnToggle = document.getElementById('turnToggle');
const sidebarToggle = document.getElementById('sidebarToggle');
const sessionCount = document.getElementById('sessionCount');
const currentSession = document.getElementById('currentSession');
const turnList = document.getElementById('turns');
const turnCount = document.getElementById('turnCount');
const noTurns = document.getElementById('noTurns');
const pos = document.getElementById('pos');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const endBtn = document.getElementById('end');

if (!window.marked) {
  banner.style.display = 'block';
  banner.textContent =
    'Could not load the rendering libraries from the CDN (offline?). Showing raw text.';
}

/* --------------------------------------------------------------------- *
 * Math extraction
 *
 * Markdown and TeX fight over the same characters: `x_1` becomes italics,
 * `\\` becomes a line break. So math is pulled out into placeholders before
 * markdown parsing and re-inserted, already rendered, afterwards. Fenced
 * blocks and inline code spans are skipped so `$5` in a shell snippet stays
 * a dollar sign.
 * --------------------------------------------------------------------- */

const TOKEN = 'mdsvmath';
const ENV = /^\\begin\{(equation|align|aligned|gather|gathered|multline|cases|split|array|[pbBvV]matrix)(\*?)\}[\s\S]*?\\end\{\1\2\}/;
const INLINE_DOLLAR = /^\$(?!\s)((?:\\.|[^$])+?)(?<!\s|\\)\$(?!\d)/;

function extractMath(src) {
  const found = [];
  let out = '';
  let i = 0;
  const N = src.length;
  const eol = (p) => { const k = src.indexOf('\n', p); return k === -1 ? N : k; };
  const push = (tex, display) => {
    out += TOKEN + found.length + 'x';
    found.push({ tex, display });
  };

  while (i < N) {
    // Fenced code block: copy through untouched.
    if (i === 0 || src[i - 1] === '\n') {
      const open = /^ {0,3}(`{3,}|~{3,})/.exec(src.slice(i, eol(i)));
      if (open) {
        const fence = open[1];
        const close = new RegExp('^ {0,3}' + fence[0] + '{' + fence.length + ',}[ \\t]*$');
        let j = Math.min(eol(i) + 1, N);
        while (j < N) {
          const e = eol(j);
          const line = src.slice(j, e);
          j = Math.min(e + 1, N);
          if (close.test(line)) break;
        }
        out += src.slice(i, j);
        i = j;
        continue;
      }
    }

    const c = src[i];

    if (c === '`') { // inline code span
      const m = /^(`+)[\s\S]*?\1/.exec(src.slice(i));
      if (m) { out += m[0]; i += m[0].length; continue; }
    }

    if (c === '$' && src[i + 1] === '$') {
      const end = src.indexOf('$$', i + 2);
      if (end !== -1) { push(src.slice(i + 2, end), true); i = end + 2; continue; }
    }

    if (c === '\\') {
      if (src[i + 1] === '[') {
        const end = src.indexOf('\\]', i + 2);
        if (end !== -1) { push(src.slice(i + 2, end), true); i = end + 2; continue; }
      }
      if (src[i + 1] === '(') {
        const end = src.indexOf('\\)', i + 2);
        if (end !== -1) { push(src.slice(i + 2, end), false); i = end + 2; continue; }
      }
      const env = ENV.exec(src.slice(i));
      if (env) { push(env[0], true); i += env[0].length; continue; }
    }

    if (c === '$') {
      const m = INLINE_DOLLAR.exec(src.slice(i));
      // A blank line means the closing `$` belongs to another paragraph.
      if (m && !/\n[ \t]*\n/.test(m[1])) { push(m[1], false); i += m[0].length; continue; }
    }

    out += c;
    i++;
  }

  return { text: out, found };
}

function renderMath(html, found) {
  if (!found.length) return html;

  const draw = (m) => {
    if (!window.katex) return '<span class="math-error">' + escapeHtml(m.tex) + '</span>';
    try {
      return katex.renderToString(m.tex, {
        displayMode: m.display,
        throwOnError: false,
        strict: 'ignore',
      });
    } catch (err) {
      return '<span class="math-error">' + escapeHtml(m.tex) + '</span>';
    }
  };

  // A display formula alone in a paragraph: unwrap it, since KaTeX emits a
  // <div> and a <div> inside a <p> gets torn apart by the HTML parser.
  html = html.replace(
    new RegExp('<p>\\s*' + TOKEN + '(\\d+)x\\s*</p>', 'g'),
    (whole, idx) => (found[idx] && found[idx].display ? draw(found[idx]) : whole)
  );

  return html.replace(new RegExp(TOKEN + '(\\d+)x', 'g'),
    (whole, idx) => (found[idx] ? draw(found[idx]) : whole));
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

/* --------------------------------------------------------------------- *
 * Rendering
 * --------------------------------------------------------------------- */

if (window.marked) {
  marked.setOptions({ gfm: true, breaks: false });
}

function toHtml(markdown) {
  if (!window.marked) return '<pre>' + escapeHtml(markdown) + '</pre>';
  const { text, found } = extractMath(markdown);
  return renderMath(marked.parse(text), found);
}

function highlight(root) {
  if (!window.hljs) return;
  root.querySelectorAll('pre code').forEach((el) => {
    try { hljs.highlightElement(el); } catch {}
  });
}

/* --------------------------------------------------------------------- *
 * Turns
 *
 * The file holds the whole conversation, each block introduced by a marker
 * the extractor wrote: `<!--mdsv u <iso timestamp>-->` for a prompt, `a` for
 * a reply. Splitting on it is what turns a wall of markdown into something
 * you can page back through.
 * --------------------------------------------------------------------- */

const MARKER = /^<!--mdsv ([ua]) ?([^>]*)-->$/m;

function parseTurns(src) {
  // split() keeps the capture groups, so the tail runs [role, ts, text, ...].
  const parts = src.split(MARKER);
  if (parts.length < 4) {
    const body = src.trim();
    return body ? [{ role: 'a', ts: '', text: body }] : [];
  }
  const turns = [];
  for (let i = 1; i + 2 < parts.length + 1; i += 3) {
    const text = (parts[i + 2] || '').trim();
    if (text) turns.push({ role: parts[i], ts: parts[i + 1] || '', text });
  }
  return turns;
}

function clock(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function firstLine(text) {
  const line = text.split('\n').find((l) => l.trim()) || '';
  return line.replace(/^[#>\-*\s]+/, '').slice(0, 120) || '(empty)';
}

function buildTurn(turn, index, askNumber) {
  const el = document.createElement('section');
  el.className = 'turn ' + (turn.role === 'u' ? 'ask' : 'reply');
  el.id = 't' + index;
  el.dataset.role = turn.role;

  if (turn.role !== 'u') {
    el.innerHTML = toHtml(turn.text);
    highlight(el);
    return el;
  }

  el.dataset.ask = String(askNumber);

  const who = document.createElement('div');
  who.className = 'who';
  const idx = document.createElement('span');
  idx.className = 'idx';
  idx.textContent = 'Q' + askNumber;
  const when = document.createElement('span');
  when.className = 'when';
  when.textContent = clock(turn.ts);
  who.append(idx, when);

  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = toHtml(turn.text);
  highlight(body);

  const more = document.createElement('button');
  more.className = 'more';
  more.type = 'button';
  more.textContent = 'show more';
  more.onclick = () => {
    const open = el.classList.toggle('clipped');
    el.classList.toggle('was-clipped', !open);
    more.textContent = open ? 'show more' : 'show less';
  };

  el.append(who, body, more);
  return el;
}

// A long pasted prompt gets folded away, but only once it is in the document
// and its real height is known.
function clipLongPrompts() {
  doc.querySelectorAll('.ask:not(.was-clipped):not(.clipped)').forEach((el) => {
    const body = el.querySelector('.body');
    if (body && body.scrollHeight > 240) el.classList.add('clipped');
  });
}

let turns = [];   // the raw blocks currently on screen

// Only the tail of a conversation changes between updates, so rebuilding the
// blocks that actually differ keeps KaTeX and highlight.js off the hot path.
function render(markdown) {
  const next = parseTurns(markdown);
  const kids = doc.children;

  let asks = 0;
  for (let i = 0; i < next.length; i++) {
    if (next[i].role === 'u') asks++;
    const old = turns[i];
    if (old && old.role === next[i].role && old.text === next[i].text) continue;
    const el = buildTurn(next[i], i, asks);
    if (kids[i]) doc.replaceChild(el, kids[i]);
    else doc.append(el);
  }
  while (kids.length > next.length) doc.removeChild(kids[kids.length - 1]);

  turns = next;
  clipLongPrompts();
  drawTurnList();
  markPosition();
}

/* --------------------------------------------------------------------- *
 * Navigating
 * --------------------------------------------------------------------- */

let asks = [];        // indices into `turns` of the prompts
let current = 0;      // which prompt the reader is sitting in

function drawTurnList() {
  asks = [];
  turns.forEach((t, i) => { if (t.role === 'u') asks.push(i); });

  turnCount.textContent = asks.length ? String(asks.length) : '';
  noTurns.style.display = asks.length ? 'none' : 'block';

  turnList.innerHTML = '';
  asks.forEach((turnIndex, n) => {
    const btn = document.createElement('button');
    btn.className = 'jump';
    btn.dataset.n = String(n);
    btn.title = turns[turnIndex].text.slice(0, 400);

    const num = document.createElement('span');
    num.className = 'n';
    num.textContent = String(n + 1);

    const q = document.createElement('span');
    q.className = 'q';
    q.textContent = firstLine(turns[turnIndex].text);

    btn.append(num, q);
    btn.onclick = () => goTo(n);
    turnList.append(btn);
  });
}

function goTo(n) {
  if (!asks.length) return;
  const clamped = Math.max(0, Math.min(asks.length - 1, n));
  const el = document.getElementById('t' + asks[clamped]);
  if (!el) return;
  // Reading a question means leaving the tail, so stop chasing new output.
  follow.checked = false;
  el.scrollIntoView({ block: 'start' });
  current = clamped;
  markPosition();
}

// Whichever prompt last crossed under the header is the one being read.
function markPosition() {
  if (asks.length) {
    let n = 0;
    for (let i = 0; i < asks.length; i++) {
      const el = document.getElementById('t' + asks[i]);
      if (el && el.getBoundingClientRect().top <= 72) n = i;
      else break;
    }
    current = n;
    pos.textContent = (current + 1) + ' / ' + asks.length;
  } else {
    pos.textContent = '—';
  }

  prevBtn.disabled = !asks.length || current === 0;
  nextBtn.disabled = !asks.length || current >= asks.length - 1;

  turnList.querySelectorAll('.jump').forEach((btn) => {
    const here = Number(btn.dataset.n) === current && asks.length > 0;
    btn.classList.toggle('here', here);
    if (here) btn.scrollIntoView({ block: 'nearest' });
  });
}

prevBtn.onclick = () => goTo(current - 1);
nextBtn.onclick = () => goTo(current + 1);
endBtn.onclick = () => {
  follow.checked = true;
  window.scrollTo({ top: document.body.scrollHeight });
};

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

  if (e.key === 'j') { goTo(current + 1); e.preventDefault(); }
  else if (e.key === 'k') { goTo(current - 1); e.preventDefault(); }
  else if (e.key === 'g') { goTo(0); e.preventDefault(); }
  else if (e.key === 'G') { endBtn.onclick(); e.preventDefault(); }
  else if (e.key === 's') { sidebarToggle.click(); e.preventDefault(); }
});

let ticking = false;
window.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; markPosition(); });
}, { passive: true });

const nearBottom = () =>
  window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;

/* --------------------------------------------------------------------- *
 * Sessions
 *
 * `pinned` null means "whichever session answered most recently", so a tab
 * left alone always shows the freshest output. Clicking a session pins it,
 * and the ?s= parameter keeps that choice across reloads — which is how you
 * put two Claude Code windows on two monitors.
 * --------------------------------------------------------------------- */

let pinned = new URLSearchParams(location.search).get('s');
let sessions = [];
let shownId = null;
let shownMtime = 0;

function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

function targetId() {
  if (pinned && sessions.some((s) => s.id === pinned)) return pinned;
  return sessions.length ? sessions[0].id : null;
}

/* ------------------------------------------------------------------ *
 * Folding things away
 *
 * Both sidebar panes fold, and the sidebar itself can go entirely, leaving
 * the conversation the whole window. Each choice is remembered.
 * ------------------------------------------------------------------ */

/** localStorage is unavailable in some privacy modes; never let it throw. */
function recall(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value === '1';
  } catch {
    return fallback;
  }
}

function remember(key, value) {
  try {
    localStorage.setItem(key, value ? '1' : '0');
  } catch {
    // Then it simply forgets between visits.
  }
}

/** Wire a pane header so clicking it folds the pane away. */
function makeFoldable(pane, toggle, key) {
  const apply = (collapsed) => {
    pane.classList.toggle('collapsed', collapsed);
    toggle.setAttribute('aria-expanded', String(!collapsed));
    remember(key, collapsed);
  };

  apply(recall(key, false));

  toggle.onclick = () => apply(!pane.classList.contains('collapsed'));
  toggle.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggle.click();
    }
  };
}

makeFoldable(sessionPane, sessionToggle, 'mdserve.sessions.collapsed');
makeFoldable(turnPane, turnToggle, 'mdserve.questions.collapsed');

const SIDEBAR_KEY = 'mdserve.sidebar.hidden';

function setSidebar(hidden) {
  shell.classList.toggle('no-sidebar', hidden);
  sidebarToggle.setAttribute('aria-pressed', String(hidden));
  remember(SIDEBAR_KEY, hidden);
}

setSidebar(recall(SIDEBAR_KEY, false));
sidebarToggle.onclick = () => setSidebar(!shell.classList.contains('no-sidebar'));

/* ------------------------------------------------------------------ *
 * Deleting a session
 * ------------------------------------------------------------------ */

let disarmTimer = null;

/** Put every armed delete button back to its resting state. */
function disarmDeletes() {
  clearTimeout(disarmTimer);
  for (const b of list.querySelectorAll('.del.confirm')) {
    b.classList.remove('confirm');
    b.dataset.armed = '';
    b.textContent = '\u00d7';
    b.title = 'delete this rendered conversation';
  }
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.del')) disarmDeletes();
});

async function removeSession(id) {
  const res = await fetch('/session?s=' + encodeURIComponent(id), { method: 'DELETE' });
  if (!res.ok) return;

  // Do not leave the page pinned to something that no longer exists.
  if (pinned === id) {
    pinned = null;
    history.replaceState(null, '', location.pathname);
  }
  await sync(true);
}

function deleteButton(session) {
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.textContent = '\u00d7';
  del.title = 'delete this rendered conversation';
  del.setAttribute('aria-label', 'delete ' + session.title);

  // Two clicks, not a modal: the first arms it, the second means it.
  del.onclick = (e) => {
    e.stopPropagation();
    if (del.dataset.armed === '1') {
      removeSession(session.id).catch(() => {});
      return;
    }
    disarmDeletes();
    del.dataset.armed = '1';
    del.classList.add('confirm');
    del.textContent = 'delete?';
    del.title = 'click again to delete';
    disarmTimer = setTimeout(disarmDeletes, 4000);
  };

  return del;
}

function drawList() {
  const active = targetId();
  empty.style.display = sessions.length ? 'none' : 'block';
  latestBtn.classList.toggle('active', !pinned);

  sessionCount.textContent = sessions.length ? sessions.length : '';
  const current = sessions.find((s) => s.id === active);
  currentSession.textContent = current ? current.title : 'none';

  disarmDeletes();
  list.innerHTML = '';
  for (const s of sessions) {
    const row = document.createElement('div');
    row.className = 'row';

    const btn = document.createElement('button');
    btn.className = 'session' + (s.id === active ? ' active' : '');
    btn.title = s.cwd || s.id;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.title;

    const sub = document.createElement('span');
    sub.className = 'sub';
    const folder = (s.cwd || '').split('/').filter(Boolean).pop() || '~';
    const bits = [folder, ago(s.updated)];
    if (s.turns) bits.splice(1, 0, s.turns + ' turns');
    sub.innerHTML = '';
    bits.forEach((bit, i) => {
      if (i) sub.append(Object.assign(document.createElement('span'), {
        className: 'dot', textContent: '·',
      }));
      sub.append(bit);
    });

    btn.append(name, sub);
    btn.onclick = () => {
      pinned = s.id;
      history.replaceState(null, '', '?s=' + encodeURIComponent(s.id));
      sync(true);
    };

    row.append(btn, deleteButton(s));
    list.append(row);
  }
}

latestBtn.onclick = () => {
  pinned = null;
  history.replaceState(null, '', location.pathname);
  sync(true);
};

async function sync(force) {
  sessions = await fetch('/api/sessions', { cache: 'no-store' }).then((r) => r.json());
  drawList();

  const id = targetId();
  if (!id) return;

  const meta = sessions.find((s) => s.id === id);
  if (!force && id === shownId && meta.updated === shownMtime) return;

  const res = await fetch('/raw?s=' + encodeURIComponent(id), { cache: 'no-store' });
  if (!res.ok) return;
  const text = await res.text();

  const switching = id !== shownId;
  // Untouched blocks keep their place, so a reader parked mid-history stays
  // there; only the tail moves.
  const stick = switching || (follow.checked && nearBottom());
  if (switching) turns = [];
  render(text);
  if (stick) window.scrollTo({ top: document.body.scrollHeight });

  shownId = id;
  shownMtime = Number(res.headers.get('X-Mtime')) || meta.updated;
  where.textContent = meta.title + (pinned ? '' : '  (latest)');
  document.title = meta.title || 'mdserve';
}

/* --------------------------------------------------------------------- *
 * Live updates
 * --------------------------------------------------------------------- */

function connect() {
  const es = new EventSource('/events');

  es.onopen = () => dot.classList.add('live');
  es.addEventListener('update', () => sync(false).catch(() => {}));

  es.onerror = () => {
    dot.classList.remove('live');
    // EventSource retries on its own; this only covers a server restart that
    // closed the stream for good.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 1000);
  };
}

connect();
sync(true).catch(() => {});
setInterval(drawList, 30000); // keep the "3m ago" labels honest
</script>
</body>
</html>
